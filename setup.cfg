[metadata]
name = litearm-mujoco
version = 0.3.0
description = LiteArm 7-DOF MuJoCo simulation, API-compatible with litearm-python
long_description = file: README.md
long_description_content_type = text/markdown
author = hzh
license = Proprietary
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
python_requires = >=3.10
package_dir =
    = src
packages = find:
install_requires =
    mujoco>=3.0
    numpy>=1.21

[options.packages.find]
where = src

[options.package_data]
litearm_mujoco =
    assets/*.xml
    assets/meshes/*.STL

[options.extras_require]
dev =
    pytest
    pytest-timeout
mirror =
    eclipse-zenoh>=1.0
    protobuf>=4.0